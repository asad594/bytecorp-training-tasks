<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="card-client" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-backend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#0a1d27"/>
    </linearGradient>
    <linearGradient id="card-data" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b3d"/>
      <stop offset="100%" stop-color="#1a1126"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="680" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <g transform="translate(40, 45)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">System Architecture &amp; Service Interaction</text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">Multi-tier Fullstack Job Board Ecosystem with Isolated Observability Database</text>
  </g>

  <!-- LAYER 1: CLIENT APPLICATIONS -->
  <g transform="translate(40, 100)">
    <rect width="1020" height="150" rx="12" fill="url(#card-client)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
    <text x="24" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TIER 1: PRESENTATION &amp; CONSUMER INTERFACES</text>

    <!-- Box 1: React 19 Frontend -->
    <g transform="translate(24, 48)">
      <rect width="470" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Job Board Web Portal (Frontend)</text>
      <text x="16" y="48" font-family="sans-serif" font-size="12" fill="#94a3b8">React 19 &bull; Vite 8 &bull; Tailwind CSS v4 &bull; TanStack Query 5</text>
      <text x="16" y="68" font-family="sans-serif" font-size="11" fill="#64748b">Candidate browsing, application submission &amp; Recruiter dashboards</text>
    </g>

    <!-- Box 2: Payload CMS Admin -->
    <g transform="translate(526, 48)">
      <rect width="470" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="16" y="28" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff">Content Management System (CMS)</text>
      <text x="16" y="48" font-family="sans-serif" font-size="12" fill="#94a3b8">Payload CMS 3 &bull; Next.js 16 &bull; Lexical Editor &bull; TypeScript</text>
      <text x="16" y="68" font-family="sans-serif" font-size="11" fill="#64748b">Editorial content management, marketing pages &amp; system config</text>
    </g>
  </g>

  <!-- Connectors from Layer 1 to Layer 2 -->
  <path d="M 275 250 V 290" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text x="290" y="275" font-family="sans-serif" font-size="11" fill="#38bdf8">REST APIs / JWT</text>

  <path d="M 760 250 V 490" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow-purple)"/>
  <text x="770" y="370" font-family="sans-serif" font-size="11" fill="#c084fc">Direct Postgres Adapter</text>

  <!-- LAYER 2: API & APPLICATION SERVER -->
  <g transform="translate(40, 290)">
    <rect width="1020" height="170" rx="12" fill="url(#card-backend)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
    <text x="24" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">TIER 2: DJANGO 6 REST FRAMEWORK BACKEND</text>

    <!-- App Modules Grid -->
    <g transform="translate(24, 46)">
      <!-- Accounts -->
      <rect x="0" y="0" width="180" height="98" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">accounts</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">JWT Auth, Google SSO</text>
      <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">RBAC: Seeker/Rep/Admin</text>
      <text x="14" y="82" font-family="sans-serif" font-size="10" fill="#64748b">Password Reset flow</text>

      <!-- Companies -->
      <rect x="195" y="0" width="185" height="98" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">companies</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Company profiles</text>
      <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">Verification &amp; Moderation</text>
      <text x="14" y="82" font-family="sans-serif" font-size="10" fill="#64748b">Membership junction</text>

      <!-- Jobs -->
      <rect x="395" y="0" width="185" height="98" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">jobs &amp; skills</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Listings CRUD &amp; filtering</text>
      <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">Tagging &amp; requirements</text>
      <text x="14" y="82" font-family="sans-serif" font-size="10" fill="#64748b">Salary &amp; type filters</text>

      <!-- Applications -->
      <rect x="595" y="0" width="185" height="98" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">job_applications</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Resume submission</text>
      <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">Review &amp; status pipeline</text>
      <text x="14" y="82" font-family="sans-serif" font-size="10" fill="#64748b">Candidate tracking</text>

      <!-- Observability -->
      <rect x="795" y="0" width="175" height="98" rx="8" fill="#182234" stroke="#0284c7" stroke-width="1"/>
      <text x="14" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#38bdf8">observability</text>
      <text x="14" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Correlation ID UUID</text>
      <text x="14" y="64" font-family="sans-serif" font-size="10" fill="#94a3b8">JSON structured logs</text>
      <text x="14" y="82" font-family="sans-serif" font-size="10" fill="#38bdf8">LoggingRouter &gt;&gt; logs_db</text>
    </g>
  </g>

  <!-- Connectors from Layer 2 to Layer 3 -->
  <path d="M 275 460 V 500" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 910 460 V 500" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- LAYER 3: DATA & STORAGE TIER -->
  <g transform="translate(40, 500)">
    <rect width="1020" height="140" rx="12" fill="url(#card-data)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" filter="url(#shadow)"/>
    <text x="24" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#c084fc" letter-spacing="1">TIER 3: PERSISTENCE, LOG ISOLATION &amp; STATIC STORAGE</text>

    <g transform="translate(24, 46)">
      <!-- Database 1: Default Primary DB -->
      <rect x="0" y="0" width="310" height="72" rx="8" fill="#150f22" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">PostgreSQL (Primary DB)</text>
      <text x="16" y="44" font-family="sans-serif" font-size="11" fill="#c084fc">Users, Companies, Jobs, Applications, Skills</text>
      <text x="16" y="60" font-family="sans-serif" font-size="10" fill="#64748b">ACID Transactions &bull; Foreign Keys &bull; Relational Integrity</text>

      <!-- Database 2: Dedicated Logs DB -->
      <rect x="330" y="0" width="310" height="72" rx="8" fill="#150f22" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">logs_db (Isolated Logging DB)</text>
      <text x="16" y="44" font-family="sans-serif" font-size="11" fill="#f59e0b">RequestLog Model &bull; Correlation ID Traces</text>
      <text x="16" y="60" font-family="sans-serif" font-size="10" fill="#64748b">Zero impact on main transactional workloads</text>

      <!-- Storage 3: Media & Static Files -->
      <rect x="660" y="0" width="310" height="72" rx="8" fill="#150f22" stroke="#475569" stroke-width="1"/>
      <text x="16" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Media &amp; Static Storage</text>
      <text x="16" y="44" font-family="sans-serif" font-size="11" fill="#38bdf8">Candidate Resumes &bull; Logos &bull; WhiteNoise Assets</text>
      <text x="16" y="60" font-family="sans-serif" font-size="10" fill="#64748b">Rotated Log Files (logs/app.log capped 5MB x 5)</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="240" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Grid Lines -->
  <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>
  <path d="M200 0 V240 M400 0 V240 M600 0 V240 M800 0 V240 M1000 0 V240" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Logo Mark -->
  <g transform="translate(60, 48)">
    <rect width="64" height="64" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M20 20 H44 V28 H28 V34 H40 V42 H28 V44 H44 V52 H20 Z" fill="#38bdf8"/>
    <circle cx="48" cy="18" r="4" fill="#818cf8"/>
  </g>

  <!-- Main Title -->
  <text x="145" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#cyan-glow)" letter-spacing="1">
    BYTECORP JOB BOARD PLATFORM
  </text>

  <!-- Subtitle -->
  <text x="145" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
    Enterprise Fullstack Career Ecosystem &bull; Django 6 &bull; React 19 &bull; Payload CMS 3 &bull; PostgreSQL
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(60, 160)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="38" rx="19" fill="url(#badge-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="20" cy="19" r="5" fill="#38bdf8"/>
    <text x="34" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Django REST API</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="175" height="38" rx="19" fill="url(#badge-grad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="200" cy="19" r="5" fill="#818cf8"/>
    <text x="214" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">React 19 + Tailwind</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="175" height="38" rx="19" fill="url(#badge-grad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="390" cy="19" r="5" fill="#c084fc"/>
    <text x="404" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Payload Headless CMS</text>

    <!-- Pill 4 -->
    <rect x="560" y="0" width="170" height="38" rx="19" fill="url(#badge-grad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="580" cy="19" r="5" fill="#34d399"/>
    <text x="594" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Role-Based Auth (JWT)</text>

    <!-- Pill 5 -->
    <rect x="745" y="0" width="180" height="38" rx="19" fill="url(#badge-grad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="765" cy="19" r="5" fill="#f59e0b"/>
    <text x="779" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Observability &amp; Logs</text>

    <!-- Pill 6 -->
    <rect x="940" y="0" width="180" height="38" rx="19" fill="url(#badge-grad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="960" cy="19" r="5" fill="#06b6d4"/>
    <text x="974" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">PostgreSQL Relational</text>
  </g>
</svg>

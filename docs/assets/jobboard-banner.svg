<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="40%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e32"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="tagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="200" cy="150" r="260" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1000" cy="450" r="320" fill="#6366f1" opacity="0.09"/>

  <!-- Subtle Geometric Grid Lines -->
  <path d="M0 80 H1200 M0 240 H1200 M0 400 H1200 M0 560 H1200" stroke="#334155" stroke-opacity="0.12" stroke-width="1"/>
  <path d="M150 0 V630 M350 0 V630 M550 0 V630 M750 0 V630 M950 0 V630 M1150 0 V630" stroke="#334155" stroke-opacity="0.12" stroke-width="1"/>

  <!-- ================= TOP NAVIGATION BAR ================= -->
  <rect x="50" y="24" width="1100" height="60" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>
  
  <!-- Logo Mark -->
  <g transform="translate(74, 37)">
    <rect width="34" height="34" rx="8" fill="url(#btnGrad)"/>
    <text x="10" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#ffffff">B</text>
    <text x="44" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="0.5">ByteCorp</text>
    <text x="127" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#38bdf8">Job Board</text>
  </g>

  <!-- Nav Links -->
  <g transform="translate(680, 58)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
    <text x="0" y="0" fill="#f8fafc">Explore Jobs</text>
    <text x="110" y="0" fill="#94a3b8">Companies</text>
    <text x="210" y="0" fill="#94a3b8">Post a Job</text>
  </g>

  <!-- Post Job Button -->
  <rect x="990" y="38" width="135" height="34" rx="8" fill="url(#btnGrad)"/>
  <text x="1020" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff">+ Post Job</text>


  <!-- ================= HERO HEADER ================= -->
  <g transform="translate(74, 135)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">OFFICIAL CAREER PLATFORM</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="url(#accentGrad)" letter-spacing="-0.5">
      ByteCorp Job Board Platform
    </text>

    <!-- Subtitle -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Fullstack Tech Recruitment Ecosystem • Empowering Candidates &amp; Employers
    </text>
  </g>

  <!-- Search Bar Mockup -->
  <g transform="translate(74, 260)">
    <rect width="1052" height="52" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#64748b">
      🔍  Search jobs by title, tech stack (Python, React, Django), or location...
    </text>
    <rect x="910" y="8" width="132" height="36" rx="8" fill="url(#btnGrad)"/>
    <text x="946" y="31" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Find Jobs</text>
  </g>

  <!-- ================= FEATURED JOB CARDS ================= -->
  <!-- Card 1 -->
  <g transform="translate(74, 340)">
    <rect width="335" height="240" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top accent line -->
    <path d="M 0 14 Q 0 0 14 0 H 321 Q 335 0 335 14 V 16 H 0 Z" fill="#38bdf8"/>
    
    <!-- Company Logo Circle & Details -->
    <circle cx="36" cy="50" r="18" fill="#0284c7"/>
    <text x="31" y="56" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">B</text>
    <text x="64" y="46" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">ByteCorp Technologies</text>
    <text x="64" y="62" font-family="sans-serif" font-size="11" fill="#38bdf8">Remote • Full-time</text>

    <!-- Job Title -->
    <text x="20" y="102" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Senior Frontend Engineer</text>
    <text x="20" y="124" font-family="sans-serif" font-size="12" fill="#94a3b8">Building reactive portals with React 19 and Tailwind CSS.</text>

    <!-- Tags -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="12" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8">React</text>

      <rect x="68" y="0" width="85" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="78" y="16" font-family="sans-serif" font-size="11" fill="#e2e8f0">TypeScript</text>

      <rect x="160" y="0" width="70" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="170" y="16" font-family="sans-serif" font-size="11" fill="#38bdf8">Tailwind</text>
    </g>

    <!-- Salary & Action -->
    <line x1="20" y1="185" x2="315" y2="185" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="214" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">PKR 220k - 320k / mo</text>
    <rect x="235" y="196" width="80" height="28" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="252" y="215" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Apply</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(432, 340)">
    <rect width="335" height="240" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top accent line -->
    <path d="M 0 14 Q 0 0 14 0 H 321 Q 335 0 335 14 V 16 H 0 Z" fill="#6366f1"/>

    <!-- Company Logo Circle & Details -->
    <circle cx="36" cy="50" r="18" fill="#4f46e5"/>
    <text x="30" y="56" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">N</text>
    <text x="64" y="46" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">NimbusWorks</text>
    <text x="64" y="62" font-family="sans-serif" font-size="11" fill="#818cf8">Karachi • Hybrid</text>

    <!-- Job Title -->
    <text x="20" y="102" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Python / Django Backend Lead</text>
    <text x="20" y="124" font-family="sans-serif" font-size="12" fill="#94a3b8">Scalable REST APIs, dual-database routing, and auth.</text>

    <!-- Tags -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="65" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="12" y="16" font-family="sans-serif" font-size="11" fill="#818cf8">Django</text>

      <rect x="73" y="0" width="60" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="83" y="16" font-family="sans-serif" font-size="11" fill="#e2e8f0">Python</text>

      <rect x="140" y="0" width="85" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="150" y="16" font-family="sans-serif" font-size="11" fill="#818cf8">Postgres</text>
    </g>

    <!-- Salary & Action -->
    <line x1="20" y1="185" x2="315" y2="185" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="214" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">PKR 250k - 380k / mo</text>
    <rect x="235" y="196" width="80" height="28" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="252" y="215" font-family="sans-serif" font-size="11" font-weight="600" fill="#818cf8">Apply</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(791, 340)">
    <rect width="335" height="240" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" filter="url(#cardShadow)"/>
    <!-- Top accent line -->
    <path d="M 0 14 Q 0 0 14 0 H 321 Q 335 0 335 14 V 16 H 0 Z" fill="#10b981"/>

    <!-- Company Logo Circle & Details -->
    <circle cx="36" cy="50" r="18" fill="#059669"/>
    <text x="31" y="56" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">S</text>
    <text x="64" y="46" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Studio Forge</text>
    <text x="64" y="62" font-family="sans-serif" font-size="11" fill="#34d399">Lahore • Full-time</text>

    <!-- Job Title -->
    <text x="20" y="102" font-family="sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Principal Product Designer</text>
    <text x="20" y="124" font-family="sans-serif" font-size="12" fill="#94a3b8">UI/UX workflows, modern components, and design systems.</text>

    <!-- Tags -->
    <g transform="translate(20, 142)">
      <rect x="0" y="0" width="60" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="12" y="16" font-family="sans-serif" font-size="11" fill="#34d399">UI/UX</text>

      <rect x="68" y="0" width="55" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="78" y="16" font-family="sans-serif" font-size="11" fill="#e2e8f0">Figma</text>

      <rect x="130" y="0" width="85" height="24" rx="6" fill="url(#tagGrad)" stroke="#334155" stroke-width="1"/>
      <text x="140" y="16" font-family="sans-serif" font-size="11" fill="#34d399">Systems</text>
    </g>

    <!-- Salary & Action -->
    <line x1="20" y1="185" x2="315" y2="185" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="214" font-family="sans-serif" font-size="13" font-weight="700" fill="#34d399">PKR 180k - 260k / mo</text>
    <rect x="235" y="196" width="80" height="28" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="252" y="215" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">Apply</text>
  </g>
</svg>

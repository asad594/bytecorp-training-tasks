<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="auto">
  <defs>
    <linearGradient id="step-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1000" height="360" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Job Application &amp; Hiring Lifecycle Process Flow</text>
  <text x="40" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">End-to-end recruitment journey from discovery to final selection</text>

  <!-- Step 1: Browse & Filter -->
  <g transform="translate(40, 110)">
    <rect width="160" height="190" rx="10" fill="url(#step-bg)" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="32" cy="32" r="16" fill="#0284c7"/>
    <text x="28" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Discovery</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Filter by skill</text>
    <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Salary range</text>
    <text x="20" y="144" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Employment type</text>
    <text x="20" y="166" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Location search</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 205 205 H 230" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Application Submission -->
  <g transform="translate(235, 110)">
    <rect width="160" height="190" rx="10" fill="url(#step-bg)" stroke="#818cf8" stroke-width="1"/>
    <circle cx="32" cy="32" r="16" fill="#6366f1"/>
    <text x="28" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">2</text>
    <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Application</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Upload CV/Resume</text>
    <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Cover letter entry</text>
    <text x="20" y="144" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Skill matching</text>
    <text x="20" y="166" font-family="sans-serif" font-size="11" fill="#34d399">Status: pending</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 400 205 H 425" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Recruiter Screening -->
  <g transform="translate(430, 110)">
    <rect width="160" height="190" rx="10" fill="url(#step-bg)" stroke="#c084fc" stroke-width="1"/>
    <circle cx="32" cy="32" r="16" fill="#a855f7"/>
    <text x="28" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Screening</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Rep dashboard</text>
    <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Candidate review</text>
    <text x="20" y="144" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Resume preview</text>
    <text x="20" y="166" font-family="sans-serif" font-size="11" fill="#f59e0b">Status: reviewed</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 595 205 H 620" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Decision Pipeline -->
  <g transform="translate(625, 110)">
    <rect width="160" height="190" rx="10" fill="url(#step-bg)" stroke="#34d399" stroke-width="1"/>
    <circle cx="32" cy="32" r="16" fill="#10b981"/>
    <text x="28" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">4</text>
    <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Evaluation</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Shortlist action</text>
    <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Rejection action</text>
    <text x="20" y="144" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Interview invite</text>
    <text x="20" y="166" font-family="sans-serif" font-size="11" fill="#38bdf8">Status update</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 790 205 H 815" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Notification & Result -->
  <g transform="translate(820, 110)">
    <rect width="140" height="190" rx="10" fill="url(#step-bg)" stroke="#f43f5e" stroke-width="1"/>
    <circle cx="32" cy="32" r="16" fill="#e11d48"/>
    <text x="28" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">5</text>
    <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">Outcome</text>
    <text x="20" y="100" font-family="sans-serif" font-size="11" fill="#34d399">&#10003; shortlisted</text>
    <text x="20" y="122" font-family="sans-serif" font-size="11" fill="#f43f5e">&#10007; rejected</text>
    <text x="20" y="144" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Realtime alerts</text>
    <text x="20" y="166" font-family="sans-serif" font-size="11" fill="#94a3b8">&bull; Candidate notified</text>
  </g>
</svg>

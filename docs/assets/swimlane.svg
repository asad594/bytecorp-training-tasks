<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" width="100%" height="auto">
  <defs>
    <linearGradient id="lane-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1050" height="560" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="35" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Multi-Role Swimlane Operational Workflow</text>
  <text x="35" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#94a3b8">Cross-functional interaction across Seeker, Recruiter, Admin, and Platform Engine</text>

  <!-- Lane 1: Job Seeker -->
  <g transform="translate(30, 80)">
    <rect width="990" height="100" rx="8" fill="url(#lane-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="130" height="100" rx="8" fill="#1e293b"/>
    <text x="18" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Job Seeker</text>
    <text x="18" y="65" font-family="sans-serif" font-size="10" fill="#94a3b8">Candidate</text>

    <!-- Task nodes -->
    <rect x="150" y="25" width="160" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="165" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Register &amp; Build Profile</text>

    <rect x="360" y="25" width="160" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="375" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Search &amp; Apply to Jobs</text>

    <rect x="780" y="25" width="180" height="50" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="795" y="55" font-family="sans-serif" font-size="12" fill="#34d399">Track Application Status</text>
  </g>

  <!-- Lane 2: Company Rep -->
  <g transform="translate(30, 195)">
    <rect width="990" height="100" rx="8" fill="url(#lane-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="130" height="100" rx="8" fill="#1e293b"/>
    <text x="18" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#818cf8">Company Rep</text>
    <text x="18" y="65" font-family="sans-serif" font-size="10" fill="#94a3b8">Employer</text>

    <!-- Task nodes -->
    <rect x="150" y="25" width="160" height="50" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="165" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Register / Join Company</text>

    <rect x="420" y="25" width="160" height="50" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="445" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Post Job Openings</text>

    <rect x="620" y="25" width="180" height="50" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
    <text x="635" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Review &amp; Shortlist CVs</text>
  </g>

  <!-- Lane 3: Platform Admin -->
  <g transform="translate(30, 310)">
    <rect width="990" height="100" rx="8" fill="url(#lane-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="130" height="100" rx="8" fill="#1e293b"/>
    <text x="18" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">Admin</text>
    <text x="18" y="65" font-family="sans-serif" font-size="10" fill="#94a3b8">Moderator</text>

    <!-- Task nodes -->
    <rect x="250" y="25" width="180" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="265" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Verify Company Profile</text>

    <rect x="520" y="25" width="180" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="535" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Moderate Jobs &amp; Users</text>

    <rect x="750" y="25" width="180" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="765" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">System Health &amp; Stats</text>
  </g>

  <!-- Lane 4: System / Observability -->
  <g transform="translate(30, 425)">
    <rect width="990" height="100" rx="8" fill="url(#lane-grad)" stroke="#334155" stroke-width="1"/>
    <rect width="130" height="100" rx="8" fill="#1e293b"/>
    <text x="18" y="45" font-family="sans-serif" font-size="13" font-weight="bold" fill="#06b6d4">Platform Engine</text>
    <text x="18" y="65" font-family="sans-serif" font-size="10" fill="#94a3b8">Automations</text>

    <!-- Task nodes -->
    <rect x="220" y="25" width="190" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="235" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">JWT Token Generation</text>

    <rect x="460" y="25" width="200" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="475" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Email Alerts &amp; Notifications</text>

    <rect x="700" y="25" width="220" height="50" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
    <text x="715" y="55" font-family="sans-serif" font-size="12" fill="#f8fafc">Structured Logging to logs_db</text>
  </g>

  <!-- Flow connectors -->
  <path d="M 310 245 L 340 245 L 340 335" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>
  <path d="M 430 360 L 500 360 L 500 245" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>
  <path d="M 520 130 L 560 130 L 560 220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>
  <path d="M 710 245 L 750 245 L 750 155 L 780 155" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>
</svg>
